    Experience:
      - company: University of Pittsburgh Medical Center (UPMC)
        position: Full-time Researcher
        location: Pittsburgh, PA
        start_date: 2023-04
        end_date: 2024-05
        highlights:
          - Developed MS-SCConv, a 3D spatial-and-channel reconstruction module for nnU-Net, raising mean Dice on knee MRI from 0.811 to 0.823 with fewer parameters (SPIE Medical Imaging 2024, oral).
          - Fine-tuned SAM and benchmarked UNet++ and ViT models for segmenting knee structures on MRI.
          - Built Transit, a bidirectional Transformer for lung cancer prediction and survival analysis from CT (NLST, PLuSS), improving on previous models by about 5% on average.
          - Predicted length of stay and mortality after lung transplant with Cox proportional hazards and deep learning models on multimodal clinical data.
          - Studied 3D CycleGAN-based image harmonization and class activation mapping for locating critical slices in emphysema diagnosis.

      - company: University of Liverpool
        position: Undergraduate Researcher
        start_date: 2020-05
        end_date: 2022-06
        highlights:
          - Co-developed StarGo, a self-organizing-map pipeline that recovers hierarchical substructures from 5D spatial-kinematic Gaia data; scaled it to 85 stellar systems and identified 29 hierarchical groups, including 10 previously uncatalogued structures.
          - Implemented Bayesian parallax inversion with Monte Carlo uncertainty propagation to reconstruct reliable 3D cluster structures.
          - Contributed to three papers in The Astrophysical Journal.

    Projects:
      - name: Low-Rank Hierarchical Merging for Efficient Long-to-Short Reasoning
        start_date: 2025-12
        end_date: 2026-08
        summary: Training-free, layer-adaptive merging of long chain-of-thought models with base LLMs, guided by Hessian-based layer sensitivity. NeurIPS 2026.
        highlights:
          - 48.8% average accuracy on six math benchmarks (Qwen 1.5B), 3.2 points above ORCA-AIM, with 59.7% shorter responses.
          - Generalizes to Llama and Mistral model pairs; keeps 96.8% of R1's HumanEval accuracy with 62% shorter responses.

      - name: "CLIMB-Flow: Coupled Bayesian Posterior Sampling via Multiscale Flow Models"
        date: "2026"
        summary: Training-free posterior sampler for linear inverse problems with cascaded pixel-space flow models, using split Gibbs-Langevin dynamics with conjugate-gradient preconditioning.
        highlights:
          - Proved a generalized Tweedie identity for linear-Gaussian flow interpolants.
          - Best LPIPS on 3 of 5 ImageNet tasks; 28.10 dB PSNR and 0.907 SSIM on 8x accelerated fastMRI.

      - name: "FlowAlign: Flow-Guided Target-Space Alignment via Path Consistency"
        start_date: 2025-10
        end_date: 2026-05
        summary: Two-stage multimodal alignment that reuses a frozen conditional flow field as a path-consistency supervisor. NeurIPS 2026 (co-first author).
        highlights:
          - Best LTA, NMI, and ARI on the PBMC and BMMC single-cell benchmarks; first on all reported metrics for DINOv3-to-SigLIP2 image-text alignment (CUBICC).
          - As a plug-in PeakVI-to-scVI regularizer, reduced FOSCTTM from 0.548 to 0.068.

      - name: Variational Diffusion Recovery with Multi-scale Energy Models (VDRME)
        date: "2025"
        summary: Optimal-transport (JKO) view of multiscale diffusion recovery; each proximal step is amortized by a conditional generator for few-step energy-based generation.
        highlights:
          - FID 6.90 on CIFAR-10 with 8 steps and 4.62 on class-conditional ImageNet-256 with 4 steps, without classifier guidance or distillation.

      - name: Uni-Pose
        date: "2025"
        summary: Three-stage pose estimation framework that aligns FLUX.1 Kontext latents with a GroupPose-based sparse keypoint decoder for human and animal poses.
        highlights:
          - Outperformed the re-implemented GroupPose baseline with strong cross-dataset and cross-species generalization (COCO, MPII, AP-10K).

